    <title>随机图片接口</title>

<body> 
    <script> 
        (function () {
            // 获取当前北京时间（UTC+8）
            const now = new Date();
            const utc = now.getTime()  + (now.getTimezoneOffset()  * 60000);
            const beijingTime = new Date(utc + (3600000 * 8));
            const currentHour = beijingTime.getHours(); 
            
            // 判断是否在18:00-05:00时间段（不显示遮罩）
            const isNightMode = currentHour >= 18 || currentHour < 5;
            
            if (!isNightMode) {
                // 创建遮罩层
                const overlayDiv = document.createElement('div'); 
                overlayDiv.style.cssText  = `
                    position: fixed;
                    top: 0;
                    left: 0;
                    width: 100vw;
                    height: 100vh;
                    z-index: 99998;
                    background-color: #fff;
                `;
                document.documentElement.appendChild(overlayDiv); 
                
                // 创建图片元素
                const overlayImage = new Image();
                overlayImage.style.cssText  = `
                    position: fixed;
                    top: 0;
                    left: 0;
                    width: 100vw;
                    height: 100vh;
                    z-index: 99999;
                `;
                
                // 响应式图片路径
                const width = window.innerWidth  || document.documentElement.clientWidth; 
                overlayImage.src  = width <= 1080 ? 
                    'https://api.suxun.site/api/img?s=mobile&k=meizi'  : 
                    'https://3650000.xyz/view/api.php?p=1747637389'; 
                
                // 图片加载处理
                overlayImage.onload  = () => overlayDiv.appendChild(overlayImage); 
                overlayImage.onerror  = () => {
                    overlayImage.src  = 'https://s21.ax1x.com/2025/03/21/pE0FEtS.jpg'; 
                    overlayImage.onerror  = null;
                    overlayDiv.appendChild(overlayImage); 
                };
            }
        })();
    </script>
