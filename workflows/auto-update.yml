# 可选：GitHub 云端自动更新模板。
# 启用方式（需要 GitHub 令牌具备 workflow 权限）：
#   mkdir -p .github/workflows && cp workflows/auto-update.yml .github/workflows/
# 默认不放在 .github/workflows 下，避免首次推送因令牌无 workflow 权限被拒。
name: 自动刷新订阅

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: 编译
        run: |
          CP=$(find lib -name '*.jar' | sort | paste -sd: -)
          java -jar lib/ecj-3.36.0.jar -encoding UTF-8 -21 -cp "$CP" -d out $(find src/main/java -name '*.java')
      - name: 生成订阅
        run: |
          CP=$(find lib -name '*.jar' | sort | paste -sd: -)
          java -cp "out:$CP" com.github.catvod.pan.ReplicaSites
          python scripts/sanitize.py
      - name: 提交变更
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add output/ config/
          if git diff --cached --quiet; then echo "无变更"; exit 0; fi
          git commit -m "chore: 自动刷新订阅"
          git push
